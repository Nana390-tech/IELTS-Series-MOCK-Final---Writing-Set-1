<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Final Exam Practice · Academic Writing</title>
<style>:root{--primary:#8a3412;--primary-2:#c2410c;--primary-soft:#fbede6;--accent:#0ea5e9;--accent-dark:#0369a1;--accent-soft:#d6f0fb;--accent-ink:#fff;--bg:#faf6f3;--ink:#2a1d17;--muted:#75665e}
:root{--fs:18px;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:var(--fs);line-height:1.6;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.ar{font-family:Tahoma,"Segoe UI",Arial,sans-serif;direction:rtl;unicode-bidi:isolate}
.hidden{display:none!important}

/* ---------- start screen ---------- */
#start{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;background:radial-gradient(circle at 15% 15%,var(--accent-soft),transparent 45%),radial-gradient(circle at 85% 85%,var(--primary-soft),transparent 50%),var(--bg)}
.start-card{background:#fff;max-width:860px;width:100%;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.12);overflow:hidden}
.start-head{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:34px 36px 30px}
.start-head .tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.8em;padding:4px 12px;border-radius:30px;letter-spacing:.05em;text-transform:uppercase}
.start-head h1{margin:12px 0 6px;font-size:2.1em;line-height:1.15}
.start-head p{margin:0;opacity:.9}
.start-body{padding:28px 36px 34px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.fact{background:var(--primary-soft);border-radius:var(--radius);padding:14px 16px}
.fact b{display:block;font-size:1.5em;color:var(--primary)}
.fact span{font-size:.85em;color:var(--muted)}
.rules{background:#fffbea;border:2px solid var(--accent);border-radius:var(--radius);padding:14px 20px;margin-bottom:22px}
.rules h3{margin:0 0 6px;font-size:1em}
.rules ul{margin:0;padding-left:22px}
.rules li{margin:3px 0}
.field-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:18px}
.field-row label{font-weight:600;font-size:.9em;display:block;margin-bottom:4px}
.field-row input{width:100%;padding:12px 14px;border:2px solid #d5d9e2;border-radius:10px}
.field-row input:focus{outline:none;border-color:var(--primary)}
.start-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:12px;padding:12px 22px;font-weight:700;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-big{font-size:1.15em;padding:15px 30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.credit{text-align:center;color:var(--muted);font-size:.8em;margin-top:22px}

/* ---------- exam header ---------- */
#exam{height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--primary);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.topbar .title{font-weight:700;font-size:1.05em}
.topbar .who{opacity:.85;font-size:.85em}
.topbar .spacer{flex:1}
.timer{background:rgba(255,255,255,.14);border-radius:10px;padding:4px 14px;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.35em;min-width:120px;text-align:center}
.timer.warn{background:var(--accent);color:var(--accent-ink);animation:pulse 1s infinite}
.timer small{display:block;font-size:.5em;font-weight:600;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
@keyframes pulse{50%{transform:scale(1.05)}}
.tb-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 14px;font-weight:600;font-size:.85em}
.tb-btn:hover{background:rgba(255,255,255,.28)}
.tb-btn.submit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gear{background:none;border:none;color:#fff;opacity:.35;font-size:1.1em;padding:4px}
.gear:hover{opacity:.9}
.fontctl{display:flex;gap:4px}
.fontctl button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;width:34px;height:32px;font-weight:700}

.partbar{display:flex;gap:6px;padding:8px 16px;background:#fff;border-bottom:1px solid #e3e6ee;align-items:center;flex-wrap:wrap}
.parttab{background:var(--bg);border:2px solid transparent;border-radius:30px;padding:6px 16px;font-weight:600;color:var(--muted);font-size:.9em}
.parttab.active{background:var(--primary);color:#fff}
.parttab .cnt{font-size:.8em;opacity:.8;margin-left:6px}
.hl-toggle{margin-left:auto;background:#fff;border:2px solid #f5d000;border-radius:30px;padding:5px 14px;font-weight:600;font-size:.85em}
.hl-toggle.on{background:#fff27a}

.main{flex:1;display:flex;min-height:0}
.pane{overflow-y:auto;padding:22px 28px 40px}
.pane.passage{flex:1 1 52%;background:#fff;border-right:4px solid var(--primary-soft)}
.pane.qs{flex:1 1 48%;background:var(--bg)}
.pane.qs.full{flex-basis:100%;max-width:1000px;margin:0 auto}
.passage h2{margin:0 0 4px;color:var(--primary);font-size:1.45em}
.passage .sub{color:var(--muted);font-style:italic;margin:0 0 16px}
.passage .readhead{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-dark);font-weight:700}
.passage p{margin:0 0 14px}
.passage p .pl{font-weight:800;color:var(--primary);margin-right:8px}
.passage.hlmode{cursor:text}
mark{background:#fff27a;padding:0 1px;border-radius:2px;cursor:pointer}

/* ---------- questions ---------- */
.group{background:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.group h3{margin:0 0 4px;color:var(--primary);font-size:1.05em}
.instr{margin:0 0 12px;color:#333}
.instr b{color:var(--accent-dark)}
.optbox{background:var(--primary-soft);border-radius:10px;padding:10px 16px;margin:0 0 14px}
.optbox h4{margin:0 0 4px;font-size:.95em}
.optbox div{margin:2px 0}
.optbox .L{font-weight:800;color:var(--primary);display:inline-block;min-width:34px}
.example{background:#f3f4f6;border-left:4px solid var(--muted);padding:6px 12px;margin-bottom:12px;font-size:.92em}
.q{display:flex;gap:12px;padding:10px 0;border-top:1px dashed #e3e6ee;align-items:flex-start}
.q:first-of-type{border-top:none}
.qn{flex:0 0 auto;background:var(--primary);color:#fff;font-weight:800;border-radius:8px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:.9em;padding:0 6px}
.qbody{flex:1}
.qbody p{margin:0 0 6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.opts label:hover{background:var(--primary-soft)}
.opts input{margin-top:6px;transform:scale(1.25);accent-color:var(--primary)}
.opts label.sel{border-color:var(--primary);background:var(--primary-soft)}
.opts .ol{font-weight:800;color:var(--primary);min-width:20px}
.tfng{display:flex;gap:8px;flex-wrap:wrap}
.tfng label{border:2px solid #d5d9e2;border-radius:30px;padding:4px 14px;cursor:pointer;font-weight:600;font-size:.85em;display:flex;gap:6px;align-items:center}
.tfng input{accent-color:var(--primary)}
.tfng label.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
select.ans{padding:6px 10px;border:2px solid #cfd4de;border-radius:8px;min-width:110px;background:#fff}
input.gap{border:none;border-bottom:2px solid var(--primary);background:var(--primary-soft);padding:2px 8px;width:170px;border-radius:6px 6px 0 0}
input.gap:focus{outline:none;background:#fff8d6}
.gapwrap{white-space:nowrap}
.gapwrap b{display:inline-block;background:var(--primary);color:#fff;border-radius:6px;font-size:.75em;padding:0 6px;margin-right:4px;vertical-align:middle}
.notes{line-height:2.3}
.notes h4{margin:12px 0 0;color:var(--primary)}
.notes ul{margin:0;padding-left:22px}
.flag{background:none;border:none;font-size:1em;opacity:.3;padding:0 4px;margin-left:4px}
.flag.on{opacity:1;color:#e11d48}
.qflash{animation:flash 1.2s}
@keyframes flash{0%,40%{background:#fff27a}}

/* ---------- navigator ---------- */
.navbar{background:#fff;border-top:1px solid #e3e6ee;padding:8px 12px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:center}
.navbar .nl{font-weight:700;font-size:.75em;color:var(--muted);margin:0 6px}
.nb{width:32px;height:30px;border:2px solid #cfd4de;background:#fff;border-radius:7px;font-size:.75em;font-weight:700;color:#555;position:relative}
.nb.done{background:var(--primary);border-color:var(--primary);color:#fff}
.nb.flagged::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:#e11d48}
.nb.cur{outline:3px solid var(--accent)}

/* audio bar (listening) */
.audiobar{background:#fff;border-bottom:1px solid #e3e6ee;padding:10px 20px;display:flex;align-items:center;gap:14px}
.audiobar .icon{font-size:1.4em}
.prog{flex:1;height:10px;background:#e8eaf0;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent))}
.audiobar .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9em;min-width:120px;text-align:right}
.audiobar .st{font-weight:700;color:var(--primary);font-size:.9em}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:20px;padding:26px 28px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;color:var(--primary)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal input{width:100%;padding:10px 12px;border:2px solid #cfd4de;border-radius:10px;font-size:1.1em;letter-spacing:.3em;text-align:center}
.tpanel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 22px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.warn{background:#b91c1c}
.pausecover{position:fixed;inset:0;background:var(--primary);color:#fff;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.pausecover h2{font-size:2em;margin:0 0 10px}

/* ---------- results ---------- */
#results{max-width:1050px;margin:0 auto;padding:26px 18px 60px}
.res-hero{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-radius:24px;padding:28px 32px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:20px;align-items:center}
.res-hero h1{margin:0 0 4px;font-size:1.6em}
.res-hero .big{font-size:3.2em;font-weight:900;line-height:1}
.res-hero .lbl{font-size:.8em;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.res-hero .band{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:12px 16px;text-align:center}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.card{background:#fff;border-radius:18px;padding:20px 24px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card h2{margin:0 0 12px;color:var(--primary);font-size:1.25em}
.brow{display:grid;grid-template-columns:1.6fr 70px 2fr;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f1f5}
.bbar{height:12px;background:#eef0f4;border-radius:10px;overflow:hidden}
.bbar i{display:block;height:100%;background:var(--primary)}
.bbar i.low{background:#e11d48}.bbar i.mid{background:var(--accent)}
table.rev{width:100%;border-collapse:collapse;font-size:.92em}
table.rev th{background:var(--primary-soft);text-align:left;padding:8px}
table.rev td{padding:8px;border-bottom:1px solid #eef0f4;vertical-align:top}
.ok{color:#15803d;font-weight:800}.no{color:#b91c1c;font-weight:800}
.ev{color:var(--muted);font-size:.88em;font-style:italic}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.gloss div{background:var(--primary-soft);border-radius:10px;padding:8px 12px}
.gloss b{color:var(--primary)}
.meta{color:var(--muted);font-size:.85em}

/* certificate */
#cert{position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.certbox{background:#fff;width:900px;max-width:100%;padding:16px;border-radius:12px}
.certin{border:10px double var(--primary);padding:40px 46px;text-align:center;background:radial-gradient(circle at 50% 0,var(--accent-soft),#fff 60%)}
.certin .small{letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-size:.8em}
.certin h1{font-family:Georgia,serif;color:var(--primary);font-size:2.4em;margin:8px 0}
.certin .name{font-family:Georgia,serif;font-size:2.1em;border-bottom:2px solid var(--accent);display:inline-block;padding:0 30px 4px;margin:10px 0}
.certin .bandbig{display:inline-block;background:var(--primary);color:#fff;border-radius:50%;width:110px;height:110px;line-height:110px;font-size:2.4em;font-weight:900;margin:14px 0}
.certfoot{display:flex;justify-content:space-between;margin-top:26px;font-size:.85em;color:var(--muted)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

@media (max-width:860px){
 .main{flex-direction:column;overflow-y:auto}
 .pane{overflow:visible}
 .pane.passage{border-right:none;border-bottom:4px solid var(--primary-soft)}
 .res-hero{grid-template-columns:1fr}
 .field-row{grid-template-columns:1fr}
}
@media print{
 body{background:#fff}
 .no-print,.topbar,.navbar,.res-actions{display:none!important}
 body.printing-cert > *:not(#cert){display:none!important}
 body.printing-cert #cert{position:static;background:none;padding:0}
 body.printing-cert .certbox{box-shadow:none;width:100%}
 .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
}

.taskbox{border:2px solid var(--primary);border-radius:12px;padding:6px 18px;margin:10px 0 14px;background:var(--primary-soft)}
.chart{margin:12px 0 18px;border:1px solid #e5e7eb;border-radius:10px;padding:8px;background:#fff;text-align:center}
.writepane{display:flex;flex-direction:column;padding:16px 22px}
.wbar{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--primary);margin-bottom:6px}
.wc{background:#fff;border:2px solid #e5c9bb;border-radius:30px;padding:2px 14px;font-size:.85em;color:#7c2d12}
.wc.ok{border-color:#16a34a;color:#15803d}
.meter{height:8px;background:#ece4df;border-radius:8px;overflow:hidden;margin-bottom:10px}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.meter i.ok{background:#16a34a}
.ta{flex:1;min-height:420px;width:100%;resize:none;border:2px solid #e2d6cf;border-radius:14px;padding:18px 20px;font:inherit;line-height:1.75;background:#fff;color:var(--ink)}
.ta:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sh{font-size:1em;color:var(--primary);margin:16px 0 8px}
.answer{background:#fcfaf8;border:1px solid #eadfd8;border-radius:12px;padding:12px 16px;font-size:.95em;white-space:normal}
.answer p{margin:0 0 10px}
.answer.model{background:var(--primary-soft);border-color:transparent}
.answer.model b{color:var(--primary)}
ul.qc{list-style:none;padding:0;margin:0}
ul.qc li{padding:5px 0}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid #eee4de;border-radius:10px;padding:8px 12px;cursor:pointer}
.checks input{transform:scale(1.35);margin-top:7px;accent-color:var(--primary)}
.checks .ar{color:var(--muted);font-size:.9em}
.ckscore{font-weight:800;color:var(--primary)}
@media (max-width:860px){.twocol{grid-template-columns:1fr}}
@media print{.checks label{break-inside:avoid}}

 ['I did not give my opinion or reasons that are not in the charts.','لم أكتب رأيي أو أسبابًا غير موجودة في الرسوم']];

 ['My introduction paraphrases the question and says what the essay will do.','مقدمتي تعيد صياغة السؤال وتوضح ما سيناقشه المقال'],
 ['Body paragraph 1 explains the CAUSES (the reasons why), with an example.','الفقرة الأولى تشرح الأسباب مع مثال'],
 ['Body paragraph 2 gives SOLUTIONS that match the causes, with explanations and examples.','الفقرة الثانية تقدم حلولًا تناسب الأسباب مع شرح وأمثلة'],
 ['Each body paragraph starts with a clear topic sentence.','كل فقرة تبدأ بجملة رئيسية واضحة'],
 ['I used linking words (Firstly, Moreover, For example, As a result…).','استخدمت أدوات الربط'],
 ['My conclusion summarises the causes and solutions with no new ideas.','خاتمتي تلخص الأسباب والحلول دون أفكار جديدة'],
 ['I checked my spelling, capital letters and full stops.','راجعت الإملاء والحروف الكبيرة والنقاط']];
const LINKERS = ['overall','in addition','however','whereas','while','in contrast','similarly','followed by','then','after that','moreover','furthermore','firstly','secondly','finally','for example','for instance','such as','as a result','therefore','consequently','because','so that','another','in conclusion','to conclude','to sum up','on the other hand','although','also','the main cause','another reason','because of','due to','this is because','which leads to'];

/* ---------- charts ---------- */
function lineSVG(){
  const W=640,H=400,L=60,R=170,T=30,B=60, pw=W-L-R, ph=H-T-B, max=50;
  const x = i => L + i*(pw/(LINE.years.length-1)), y = v => T + ph - v/max*ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line graph of children attending after-school clubs" style="width:100%;max-width:640px;background:#fff">`;
  s += `<text x="${W/2-50}" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Children attending after-school clubs, 2014–2024</text>`;
  for (let v=0; v<=max; v+=10){ s += `<line x1="${L}" x2="${L+pw}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#444">${v}</text>`; }
  LINE.years.forEach((yr,i)=>{ s += `<text x="${x(i)}" y="${T+ph+20}" text-anchor="middle" font-size="12" fill="#444">${yr}</text>`; });
  s += `<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" stroke="#555"/><line x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}" stroke="#555"/>`;
  s += `<text transform="translate(16 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#333">Number of children (thousands)</text>`;
  s += `<text x="${L+pw/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="#333">Year</text>`;
  LINE.series.forEach((se,k)=>{
    s += `<polyline fill="none" stroke="${se.color}" stroke-width="3" stroke-dasharray="${se.dash}" points="${se.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
    se.v.forEach((v,i)=>{ s += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${se.color}"/>`; });
    const ly = T+20+k*26; s += `<line x1="${L+pw+16}" x2="${L+pw+46}" y1="${ly}" y2="${ly}" stroke="${se.color}" stroke-width="3" stroke-dasharray="${se.dash}"/><text x="${L+pw+52}" y="${ly+4}" font-size="12" fill="#222">${se.name}</text>`;
  });
  return s + '</svg>';
}
function barSVG(){
  const W=640,H=380,L=60,R=20,T=34,B=70, pw=W-L-R, ph=H-T-B, max=40, n=BARS.length, bw=pw/n*0.55;
  const y = v => T+ph-v/max*ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of parents' reasons for choosing a club" style="width:100%;max-width:640px;background:#fff">`;
  s += `<text x="${W/2}" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Main reasons parents gave for choosing a club, 2024</text>`;
  for (let v=0; v<=max; v+=10){ s += `<line x1="${L}" x2="${L+pw}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#444">${v}%</text>`; }
  s += `<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" stroke="#555"/><line x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}" stroke="#555"/>`;
  s += `<text transform="translate(16 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#333">Percentage of parents</text>`;
  BARS.forEach(([lab,v],i)=>{ const cx = L + pw/n*(i+.5); s += `<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${T+ph-y(v)}" fill="#c2410c" rx="3"/><text x="${cx}" y="${T+ph+18}" text-anchor="middle" font-size="12" fill="#333">${lab.length>16?lab.replace(/^(To \w+) /,'$1|').split('|').map((t,j)=>`<tspan x="${cx}" dy="${j?14:0}">${t}</tspan>`).join(''):lab}</text>`; });
  return s + '</svg>';
}

/* ---------- utils ---------- */
const fmt = sec => { sec=Math.max(0,Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); };
const words = t => (t.trim().match(/[A-Za-z0-9À-ɏ'’%.,-]+/g)||[]).filter(w=>/[A-Za-z0-9]/.test(w)).length;
const paras = t => t.split(/\n\s*\n|\n/).map(p=>p.trim()).filter(p=>p.length>0).length;
function toast(msg, ms=3500, warn=false){ let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);} t.className='toast'+(warn?' warn':''); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',ms); }
function modal(html){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box">${html}</div>`; document.body.appendChild(m); return m; }
function cover(title,msg,btn,fn){ let c=$('#cover'); if(c) c.remove(); c=document.createElement('div'); c.id='cover'; c.className='pausecover'; c.innerHTML=`<h2>${title}</h2><p style="max-width:560px">${msg}</p>${btn?`<button class="btn btn-accent btn-big" id="coverBtn">${btn}</button>`:''}`; document.body.appendChild(c); if(btn) $('#coverBtn').onclick=()=>{c.remove(); fn&&fn();}; }
function download(name, text, type='application/json'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
const fileSafe = s => (s||'student').replace(/[^\w؀-ۿ-]+/g,'_');

function showTask(t){
  S.task = t;
  $$('.parttab').forEach(b=>b.classList.toggle('active', +b.dataset.task===t));
  $$('#prompt [data-t]').forEach(d=>d.classList.toggle('hidden', +d.dataset.t!==t));
  $('#ta1').classList.toggle('hidden', t!==1); $('#ta2').classList.toggle('hidden', t!==2);
  $('#wTitle').textContent = 'Task '+t; updateCount(); $('#ta'+t).focus();
}
function updateCount(){
  const w1 = words(S.t1), w2 = words(S.t2);
  $('#c1').textContent = w1+' words'; $('#c2').textContent = w2+' words';
  const w = S.task===1?w1:w2, min = S.task===1?150:250;
  $('#wc').textContent = `${w} words · minimum ${min}`; $('#wc').classList.toggle('ok', w>=min);
  $('#meter').style.width = Math.min(100, w/min*100)+'%'; $('#meter').classList.toggle('ok', w>=min);
}
function enterExam(){ $('#start').classList.add('hidden'); $('#exam').classList.remove('hidden'); $('#who').textContent = S.name+(S.cid?' · '+S.cid:''); $('#ta1').value=S.t1; $('#ta2').value=S.t2; showTask(S.task||1); $('#timerVal').textContent=fmt(S.remaining); }
function startClock(){ running = true; endAt = Date.now()+S.remaining*1000; }
function loop(){
  if (!running || S.submitted) return;
  S.remaining = Math.max(0,(endAt-Date.now())/1000);
  $('#timerVal').textContent = fmt(S.remaining);
  $('#timer').classList.toggle('warn', S.remaining<=300);
  if (!S.moved && S.remaining <= DURATION-1200){ S.moved = true; toast('⏰ 20 minutes have passed. If you are still on Task 1, finish it now and move on to Task 2.', 7000); }
  if (!S.warned && S.remaining <= 300){ S.warned = true; toast('⏰ 5 minutes left. Finish your conclusion and check your writing.', 6000); }
  if (S.remaining <= 0) finish(true);
}

/* ---------- save / load ---------- */
function save(){ const d = JSON.parse(JSON.stringify(S)); d.savedAt = new Date().toISOString(); download(`${ID}_${fileSafe(S.name)}_progress.json`, JSON.stringify(d,null,1)); toast('💾 Progress saved to your Downloads folder.'); }
function load(file){
  const r = new FileReader(); r.onload = () => {
    let d; try{ d = JSON.parse(r.result); }catch(e){ return toast('That file could not be read.',4000,true); }
    if (d.app !== ID) return toast('This save file belongs to a different app.',5000,true);
    Object.assign(S, d);
    if (S.submitted){ $('#start').classList.add('hidden'); showResults(); return; }
    enterExam(); S.started = true;
    cover('Saved exam loaded', `Welcome back, ${esc(S.name)}. You have ${fmt(S.remaining)} left.`, 'Continue ▸', startClock);
  }; r.readAsText(file);
}

/* ---------- teacher ---------- */
function teacher(){
  const m = modal(`<h3>Teacher controls</h3><p class="meta">Enter the teacher PIN.</p><input type="password" id="pin" maxlength="8"><div class="row"><button class="btn btn-ghost" id="pc">Cancel</button><button class="btn btn-primary" id="pk">Unlock</button></div>`);
  const close = () => m.remove(); $('#pc').onclick = close; $('#pin').focus();
  const go = () => {
    if ($('#pin').value !== PIN) return toast('Wrong PIN.',2000,true);
    const paused = !running;
    m.querySelector('.box').innerHTML = `<h3>Teacher controls</h3><p class="meta">Tab switches recorded: <b>${S.tabSwitches}</b></p><div class="tpanel"><button class="btn btn-primary" id="t1">${paused?'▶ Resume':'⏸ Pause'}</button><button class="btn btn-ghost" id="t2">＋5 minutes</button><button class="btn btn-ghost" id="t3">＋1 minute</button><button class="btn btn-accent" id="t4">End exam now</button></div><div class="row"><button class="btn btn-ghost" id="t5">Close</button></div>`;
    $('#t1').onclick = () => { close(); if (paused){ $('#cover')&&$('#cover').remove(); startClock(); } else { running=false; S.remaining=Math.max(0,(endAt-Date.now())/1000); cover('⏸ Exam paused','Your teacher has paused the exam. Please wait.'); } };
    const add = s => { if (running) endAt += s*1000; else S.remaining += s; S.warned=false; toast(`${s/60} minute(s) added.`); close(); };
    $('#t2').onclick = () => add(300); $('#t3').onclick = () => add(60);
    $('#t4').onclick = () => { close(); $('#cover')&&$('#cover').remove(); finish(true); };
    $('#t5').onclick = close;
  };
  $('#pk').onclick = go; $('#pin').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

/* ---------- submit & results ---------- */
function confirmSubmit(){
  const w1=words(S.t1), w2=words(S.t2); const warn=[];
  if (w1<150) warn.push(`Task 1 has only <b>${w1}</b> words (minimum 150).`);
  if (w2<250) warn.push(`Task 2 has only <b>${w2}</b> words (minimum 250).`);
  const m = modal(`<h3>Submit your writing?</h3>${warn.length?`<p>${warn.join('<br>')}</p>`:'<p>Both tasks reach the minimum word count. Well done!</p>'}<p>You have <b>${fmt(S.remaining)}</b> left. After you submit, you <b>cannot</b> change your writing.</p><div class="row"><button class="btn btn-ghost" id="mc">Go back</button><button class="btn btn-primary" id="mk">Submit now</button></div>`);
  $('#mc').onclick = () => m.remove(); $('#mk').onclick = () => { m.remove(); finish(false); };
}
function finish(auto){
  if (S.submitted) return; running = false; S.submitted = true; S.finishedAt = new Date().toISOString();
  $$('.modal').forEach(m=>m.remove()); if (auto) toast('⏱ Time is up. Your writing has been submitted.', 5000);
  $('#exam').classList.add('hidden'); showResults();
}
function quick(t, task){
  const low = ' '+t.toLowerCase().replace(/\s+/g,' ')+' ';
  const found = LINKERS.filter(l => new RegExp('[^a-z]'+l.replace(/ /g,' ')+'[^a-z]').test(low));
  const w = words(t), p = paras(t), min = task===1?150:250;
  const items = [[w>=min, `${w} words (minimum ${min})`], [p>=4, `${p} paragraph${p===1?'':'s'} (aim for 4)`], [found.length>=5, `${found.length} different linking words: ${found.slice(0,12).join(', ')||'none found'}`]];
  if (task===1){ items.push([/\boverall\b/.test(low), 'An overview sentence with “Overall”']); const nums=(t.match(/\d[\d,.]*\s*%?/g)||[]).length; items.push([nums>=6, `${nums} numbers or percentages used`]); }
  else { items.push([/in conclusion|to conclude|to sum up|to summarise|to summarize/.test(low), 'A conclusion signal (In conclusion / To sum up)']); items.push([/for example|for instance|such as/.test(low), 'At least one example (For example / For instance / such as)']); }
  return {w, p, found, items};
}
function taskBlock(n){
  const t = n===1?S.t1:S.t2, q = quick(t,n), model = n===1?MODEL1:MODEL2, list = n===1?CHECK1:CHECK2;
  const theirs = t.trim() ? t.split(/\n+/).filter(x=>x.trim()).map(p=>`<p>${esc(p)}</p>`).join('') : '<p class="meta">(No writing submitted.)</p>';
  return `<div class="card"><h2>Task ${n} ${n===1?'· Report on two charts':'· Cause–solution essay'}</h2>
   <div class="twocol"><div><h3 class="sh">Your answer</h3><div class="answer">${theirs}</div></div>
   <div><h3 class="sh">Model answer <span class="meta">(Band 7 · linking words in bold)</span></h3><div class="answer model">${model.map(p=>`<p>${p}</p>`).join('')}</div></div></div>
   <h3 class="sh">Quick checks (automatic)</h3><ul class="qc">${q.items.map(([ok,txt])=>`<li class="${ok?'yes':'noo'}">${ok?'✅':'⚠️'} ${esc(txt)}</li>`).join('')}</ul>
   <h3 class="sh">Self-check: compare your answer with the model and tick what you did</h3>
   <div class="checks">${list.map((c,i)=>{ const k=`${n}-${i}`; return `<label><input type="checkbox" data-ck="${k}" ${S.checks[k]?'checked':''}><span>${esc(c[0])}<br><span class="ar">${esc(c[1])}</span></span></label>`; }).join('')}</div>
   <p class="ckscore" id="cks${n}"></p></div>`;
}
function showResults(){
  const w1 = words(S.t1), w2 = words(S.t2);

    <div><div class="lbl">Task 1</div><div class="big">${w1}<span style="font-size:.4em"> words</span></div></div>
    <div class="band"><div class="lbl">Task 2</div><div class="big">${w2}<span style="font-size:.4em"> words</span></div></div></div>

    const txt = `IELTS Final Exam Practice — Writing\nName: ${S.name}\nID: ${S.cid}\nSubmitted: ${new Date(S.finishedAt).toLocaleString()}\nTab switches: ${S.tabSwitches}\n\n=== TASK 1 (${w1} words) ===\n\n${S.t1}\n\n=== TASK 2 (${w2} words) ===\n\n${S.t2}\n`;

/* ---------- init ---------- */
function init(){
  build();
  const nm=$('#sname'), sb=$('#startBtn'); nm.addEventListener('input',()=>sb.disabled=nm.value.trim().length<3);
  sb.onclick = () => { S.name=nm.value.trim(); S.cid=$('#sid').value.trim(); S.started=true; S.startedAt=new Date().toISOString(); enterExam(); startClock(); };
  $('#loadFile').addEventListener('change', e=>{ if(e.target.files[0]) load(e.target.files[0]); e.target.value=''; });
  ['ta1','ta2'].forEach((id,i)=>{ const ta=$('#'+id);
    ta.addEventListener('input',()=>{ S['t'+(i+1)]=ta.value; updateCount(); });
    ta.addEventListener('paste',e=>{ e.preventDefault(); toast('Pasting is switched off in the exam.',2500,true); });
    ta.addEventListener('drop',e=>e.preventDefault());
    ta.addEventListener('keydown',e=>{ if(e.key==='Tab'){ e.preventDefault(); } }); });
  $$('.parttab').forEach(b=>b.onclick=()=>showTask(+b.dataset.task));
  $('#saveBtn').onclick=save; $('#submitBtn').onclick=confirmSubmit; $('#gear').onclick=teacher;
  let fs=18; $('#fsPlus').onclick=()=>{fs=Math.min(26,fs+2);document.documentElement.style.setProperty('--fs',fs+'px');}; $('#fsMinus').onclick=()=>{fs=Math.max(14,fs-2);document.documentElement.style.setProperty('--fs',fs+'px');};
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.started&&!S.submitted){ S.tabSwitches++; setTimeout(()=>toast('⚠ Leaving the exam page is recorded and reported to your teacher.',5000,true),300); } });
  window.addEventListener('beforeunload',e=>{ if(S.started&&!S.submitted){ e.preventDefault(); e.returnValue=''; } });
  document.addEventListener('contextmenu',e=>{ if(S.started&&!S.submitted) e.preventDefault(); });
  setInterval(loop, 250);
}
init();
})();
</script>
</body></html>
